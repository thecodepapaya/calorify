server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: ${PROMTAIL_LOKI_URL}/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      # Only scrape containers that start with 'calorify-'
      - source_labels: ['__meta_docker_container_name']
        regex: '/calorify-.*'
        action: keep
      # Drop buildx/buildkit containers
      - source_labels: ['__meta_docker_container_name']
        regex: '.*buildx.*|.*buildkit.*'
        action: drop
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Add app label for calorify-backend containers
      - source_labels: ['__meta_docker_container_name']
        regex: '/calorify-backend-.*'
        target_label: 'app'
        replacement: 'calorify-backend'
      # Add environment label based on container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/calorify-backend-(prod|staging)'
        target_label: 'environment'
        replacement: '${1}'
