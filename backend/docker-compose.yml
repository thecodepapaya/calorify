services:
  # --- LOGGING INFRASTRUCTURE (shared across environments) ---
  # Note: Logging services have no profiles - they're always available
  # Start them separately: docker-compose up -d loki grafana promtail
  loki:
    image: grafana/loki:2.9.2
    container_name: calorify-loki
    restart: always
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - calorify-network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: calorify-promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - calorify-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: calorify-grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?Set GF_SECURITY_ADMIN_USER in backend/.env}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in backend/.env}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-https://logs-api-calorify.thecodepapaya.dev}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./loki/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./loki/grafana-datasources:/etc/grafana/provisioning/datasources
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - calorify-network

  # --- SHARED USDA REFERENCE DATABASE ---
  db-usda:
    image: postgres:15
    container_name: calorify-db-usda
    restart: always
    profiles: ["production", "staging", "maintenance"]
    volumes:
      - postgres_data_usda:/var/lib/postgresql/data
      - ./postgres/usda-init.sh:/docker-entrypoint-initdb.d/10-usda-reader.sh:ro
    environment:
      - POSTGRES_DB=calorify_usda
      - POSTGRES_USER=calorify_usda_owner
      - POSTGRES_PASSWORD=${POSTGRES_USDA_PASSWORD:?Set POSTGRES_USDA_PASSWORD in backend/.env}
      - USDA_READER_PASSWORD=${USDA_READER_PASSWORD:?Set USDA_READER_PASSWORD in backend/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify_usda_owner -d calorify_usda"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - calorify-network

  # --- PRODUCTION ENVIRONMENT ---
  db-prod:
    image: postgres:15
    container_name: calorify-db-prod
    restart: always
    profiles: ["production"]
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_prod
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=${POSTGRES_PROD_PASSWORD:?Set POSTGRES_PROD_PASSWORD in backend/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - calorify-network

  backend-prod:
    build:
      context: .
      target: production
    image: ${BACKEND_IMAGE:-calorify-backend-prod:local}
    container_name: calorify-backend-prod
    restart: always
    profiles: ["production"]
    ports:
      - "8000:8000"
    env_file:
      - production.env
    environment:
      - NODE_ENV=production
      - LOKI_URL=http://loki:3100
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH_OVERRIDE:-/app/runtime-secrets/firebase-service-account.json}
      - USDA_DATABASE_URL=postgresql://calorify_usda_reader:${USDA_READER_PASSWORD:?Set USDA_READER_PASSWORD in backend/.env}@db-usda:5432/calorify_usda
    volumes:
      - ./firebase-adminsdk.json:/run/secrets/firebase-service-account.json:ro
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db-prod:
        condition: service_healthy
      db-usda:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - calorify-network

  # --- STAGING ENVIRONMENT ---
  db-staging:
    image: postgres:15
    container_name: calorify-db-staging
    restart: always
    profiles: ["staging"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_staging
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=${POSTGRES_STAGING_PASSWORD:?Set POSTGRES_STAGING_PASSWORD in backend/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_staging"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - calorify-network

  backend-staging:
    build:
      context: .
      target: production
    image: ${BACKEND_IMAGE:-calorify-backend-staging:local}
    container_name: calorify-backend-staging
    restart: always
    profiles: ["staging"]
    ports:
      - "8001:8000"
    env_file:
      - staging.env
    environment:
      - NODE_ENV=staging
      - LOKI_URL=http://loki:3100
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH_OVERRIDE:-/app/runtime-secrets/firebase-service-account.json}
      - USDA_DATABASE_URL=postgresql://calorify_usda_reader:${USDA_READER_PASSWORD:?Set USDA_READER_PASSWORD in backend/.env}@db-usda:5432/calorify_usda
    volumes:
      - ./firebase-adminsdk.json:/run/secrets/firebase-service-account.json:ro
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db-staging:
        condition: service_healthy
      db-usda:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - calorify-network

  # One-off writer for initial bootstrap and future USDA release refreshes.
  # API containers never receive these owner credentials.
  usda-maintenance:
    image: ${BACKEND_IMAGE:-calorify-backend-prod:local}
    container_name: calorify-usda-maintenance
    profiles: ["maintenance"]
    command: ["node", "dist/scripts/usda-bootstrap.js"]
    environment:
      - DATABASE_URL=postgresql://calorify_usda_owner:${POSTGRES_USDA_PASSWORD:?Set POSTGRES_USDA_PASSWORD in backend/.env}@db-usda:5432/calorify_usda
      - USDA_DATABASE_URL=postgresql://calorify_usda_owner:${POSTGRES_USDA_PASSWORD:?Set POSTGRES_USDA_PASSWORD in backend/.env}@db-usda:5432/calorify_usda
    volumes:
      - ./firebase-adminsdk.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      db-usda:
        condition: service_healthy
    networks:
      - calorify-network

volumes:
  postgres_data_prod:
  postgres_data_staging:
  postgres_data_usda:
  loki_data:
  grafana_data:

networks:
  calorify-network:
    driver: bridge
