services:
  # --- LOGGING INFRASTRUCTURE (shared across environments) ---
  loki:
    image: grafana/loki:2.9.2
    container_name: calorify-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - calorify-network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: calorify-promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - calorify-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: calorify-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./loki/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./loki/grafana-datasources:/etc/grafana/provisioning/datasources
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - calorify-network

  # --- PRODUCTION ENVIRONMENT ---
  db-prod:
    image: postgres:15
    container_name: calorify-db-prod
    restart: always
    profiles: ["production"]
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_prod
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=calorify_pwd_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - calorify-network

  backend-prod:
    build: .
    image: calorify-backend-prod:latest
    container_name: calorify-backend-prod
    restart: always
    profiles: ["production"]
    ports:
      - "8000:8000"
    env_file:
      - production.env
    environment:
      - NODE_ENV=production
      - LOKI_URL=http://loki:3100
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    depends_on:
      db-prod:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - calorify-network

  # --- STAGING ENVIRONMENT ---
  db-staging:
    image: postgres:15
    container_name: calorify-db-staging
    restart: always
    profiles: ["staging"]
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_staging
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=calorify_pwd_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_staging"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - calorify-network

  backend-staging:
    build: .
    image: calorify-backend-staging:latest
    container_name: calorify-backend-staging
    restart: always
    profiles: ["staging"]
    ports:
      - "8001:8000"
    env_file:
      - staging.env
    environment:
      - NODE_ENV=staging
      - LOKI_URL=http://loki:3100
    volumes:
      - ./src:/app/src # Live reload for staging dev
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    command: npm run dev
    depends_on:
      db-staging:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - calorify-network

volumes:
  postgres_data_prod:
  postgres_data_staging:
  loki_data:
  grafana_data:

networks:
  calorify-network:
    driver: bridge