version: '3.8'

services:
  db:
    image: postgres:15
    container_name: calorify-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_db
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=calorify_pwd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: calorify-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://calorify:calorify_pwd@db:5432/calorify_db
    volumes:
      - ./app:/app/app # Live code reload for development
      - ./firebase-auth.json:/app/firebase-service-account.json:ro # Optional: map your service account
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
