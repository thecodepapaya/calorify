version: '3.8'

services:
  # --- PRODUCTION ENVIRONMENT ---
  db-prod:
    image: postgres:15
    container_name: calorify-db-prod
    restart: always
    profiles: ["production"]
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_prod
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=calorify_pwd_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-prod:
    build: .
    container_name: calorify-backend-prod
    restart: always
    profiles: ["production"]
    ports:
      - "8000:8000"
    env_file:
      - production.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    depends_on:
      db-prod:
        condition: service_healthy

  # --- STAGING ENVIRONMENT ---
  db-staging:
    image: postgres:15
    container_name: calorify-db-staging
    restart: always
    profiles: ["staging"]
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_staging
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=calorify_pwd_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_staging"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-staging:
    build: .
    container_name: calorify-backend-staging
    restart: always
    profiles: ["staging"]
    ports:
      - "8001:8000"
    env_file:
      - staging.env
    environment:
      - NODE_ENV=staging
    volumes:
      - ./src:/app/src # Live reload for staging dev
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    command: npm run dev
    depends_on:
      db-staging:
        condition: service_healthy

  # --- DATABASE ADMIN TOOL (Shared) ---
  # pgAdmin runs with any profile or standalone for database management
  # Note: depends_on is removed since it requires profiles to be active
  # pgAdmin will connect to databases when they are running
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: calorify-pgadmin
    restart: always
    # No profile = available with any profile or can be started standalone
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: calorify@thecodepapaya.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_WTF_CSRF_CHECK_ENABLED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data_prod:
  postgres_data_staging:
  pgadmin_data: