services:
  # --- PRODUCTION ENVIRONMENT ---
  db-prod:
    image: postgres:15
    container_name: calorify-db-prod
    restart: always
    profiles: ["production"]
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_prod
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=calorify_pwd_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-prod:
    build: .
    image: calorify-backend-prod:latest
    container_name: calorify-backend-prod
    restart: always
    profiles: ["production"]
    ports:
      - "8000:8000"
    env_file:
      - production.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    depends_on:
      db-prod:
        condition: service_healthy

  # --- STAGING ENVIRONMENT ---
  db-staging:
    image: postgres:15
    container_name: calorify-db-staging
    restart: always
    profiles: ["staging"]
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=calorify_staging
      - POSTGRES_USER=calorify
      - POSTGRES_PASSWORD=calorify_pwd_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorify -d calorify_staging"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-staging:
    build: .
    image: calorify-backend-staging:latest
    container_name: calorify-backend-staging
    restart: always
    profiles: ["staging"]
    ports:
      - "8001:8000"
    env_file:
      - staging.env
    environment:
      - NODE_ENV=staging
    volumes:
      - ./src:/app/src # Live reload for staging dev
      - ./firebase-adminsdk.json:/app/firebase-service-account.json:ro
    command: npm run dev
    depends_on:
      db-staging:
        condition: service_healthy

volumes:
  postgres_data_prod:
  postgres_data_staging: