syntax = "proto3";

package user;

enum Gender {
  MALE = 0;
  FEMALE = 1;
  OTHER = 2;
}

enum WeightGoal {
  LOSE_WEIGHT = 0;
  MAINTAIN_WEIGHT = 1;
  GAIN_WEIGHT = 2;
}

enum ActivityLevel {
  SEDENTARY = 0;
  LIGHTLY_ACTIVE = 1;
  MODERATELY_ACTIVE = 2;
  VERY_ACTIVE = 3;
  EXTREMELY_ACTIVE = 4;
}

enum UnitSystem {
  METRIC = 0;
  IMPERIAL = 1;
}

message UserProfile {
  optional double height = 1;
  optional double weight = 2;
  optional double target_weight = 3;
  optional Gender gender = 4;
  optional string date_of_birth = 5; // ISO calendar date (e.g., "1990-01-15")
  optional WeightGoal weight_goal = 6;
  optional ActivityLevel activity_level = 7;
  optional UnitSystem height_unit = 8;
  optional UnitSystem weight_unit = 9;
  optional int32 daily_calorie_goal = 10;
}
