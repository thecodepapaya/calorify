syntax = "proto3";

package server;
import "google/protobuf/timestamp.proto";
option go_package = "backend/internal/gen_proto/server";

message HealthResponse{
  string status = 1;
}

message LLMCallMetaData{
  enum Stage{
    UNKNOWN = 0;
    PASS_1  = 1;
    PASS_2  = 2;
    SUMMARY = 3;
  }

  int64                     id                = 1;
  optional string           analysis_id       = 2;
  google.protobuf.Timestamp created_at        = 3;
  Stage                     stage             = 4;
  string                    model             = 5;
  optional int64            prompt_tokens     = 6;
  optional int64            cached_tokens     = 7;
  optional int64            completion_tokens = 8;
  int64                     duration_ms       = 9;
  optional string           error             = 10;
}