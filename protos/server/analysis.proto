syntax = "proto3";

package server;
import "google/protobuf/timestamp.proto";
option go_package = "backend/internal/gen_proto/server";

message MealAnalysisStatus{
  enum AnalysisStatus{
    INITIATED               = 0;
    COMPONENT_DECOMPOSED    = 1;
    INGREDIENT_DECOMPOSED   = 2;
    USDA_MACRO_HYDRATED     = 3;
    CLARIFICATION_GENERATED = 4;
    CLARIFICATION_RESOLVED  = 5;
    PRESENTED               = 6;
    FAILED                  = 7;
  }

  string                             id                         = 1;
  string                             user_uid                   = 2;
  optional string                    text                       = 3;
  optional string                    image_url                  = 4;
  google.protobuf.Timestamp          created_at                 = 5;
  optional string                    decomposed_component       = 6;
  optional google.protobuf.Timestamp decomposed_component_at    = 7;
  optional string                    decomposed_ingredient      = 8;
  optional google.protobuf.Timestamp decomposed_ingredient_at   = 9;
  optional string                    usda_enriched              = 10;
  optional google.protobuf.Timestamp usda_enriched_at           = 11;
  optional string                    generated_clarification    = 12;
  optional google.protobuf.Timestamp generated_clarification_at = 13;
  optional string                    final_response             = 14;
  optional google.protobuf.Timestamp final_response_at          = 15;
  AnalysisStatus                     status                     = 16;
  google.protobuf.Timestamp          updated_at                 = 17;
  optional string                    failure_reason             = 18;
}
