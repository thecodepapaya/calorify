syntax = "proto3";

package server;
import "protos/common/meal.proto";
option go_package = "backend/internal/gen_proto/server";

enum IngredientType {
  BASE    = 0;
  BRANDED = 1;
}

message EnrichedIngredient {
  string             name            = 1;
  int64              fdc_id          = 2;
  string             description     = 3;
  float              similarity      = 4;
  common.Measurement grams           = 5;
  common.Macros      macros          = 6;
  string             canonical_name  = 7;
  common.Portion     portion         = 8;
  IngredientType     ingredient_type = 9;
  int32              component_id    = 10;
  int32              ingredient_id   = 11;
}

message EnrichedComponent {
  int32                       component_id   = 1;
  string                      name           = 2;
  string                      canonical_name = 3;
  repeated EnrichedIngredient ingredients    = 4;
  common.Macros               macros         = 5;

}

message UsdaEnriched {
  repeated EnrichedComponent components = 1;
  common.Macros              macros     = 2;
}
