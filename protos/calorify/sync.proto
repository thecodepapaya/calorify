syntax = "proto3";

package calorify.v1;

import "calorify/models.proto";

enum SyncOpType {
  SYNC_OP_TYPE_UNSPECIFIED = 0;
  SYNC_OP_TYPE_UPSERT_MEAL = 1;
  SYNC_OP_TYPE_DELETE_MEAL = 2;
  SYNC_OP_TYPE_UPSERT_PROFILE = 3;
  SYNC_OP_TYPE_FCM_TOKEN = 4;
}

message DeleteMeal {
  optional string client_id = 1;
  optional int64 local_id = 2;
}

message SyncOp {
  string idempotency_key = 1;
  SyncOpType op_type = 2;
  int64 created_at = 3; // Unix timestamp in milliseconds since epoch (UTC)

  oneof payload {
    MealInfo meal = 4;
    DeleteMeal delete_meal = 5;
    UserProfile profile = 6;
    FcmToken fcm_token = 7;
  }
}

message SyncBatch {
  repeated SyncOp ops = 1;
}

message SyncResult {
  string idempotency_key = 1;
  bool success = 2;
  string error = 3;
  string remote_id = 4;
}

message SyncAck {
  repeated SyncResult results = 1;
}
