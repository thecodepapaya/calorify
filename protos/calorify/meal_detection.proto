syntax = "proto3";

package calorify;

import "protos/calorify/meal.proto";

message ImageMealDetectionRequest {
  string image_url = 1; // URL to image
  optional string mime_type = 3; // MIME type for image_data (e.g., "image/jpeg", "image/png")
}

message TextMealDetectionRequest {
  string text_description = 1; // Text description of the meal
}

message MealDetectionResponse {
  message Clarification {
    message Option {
      string option = 1; // The option text (e.g., "curd", "labaan")
      MealMacro macro_diff = 2; // Expected macros diff if this option is selected
    }
    
    string question = 1; // The question to ask the user (e.g., "What does the white bowl contain?")
    repeated Option options = 2; // List of options with their expected macros
  }

  bool meal_identified = 1;
  CalorieConfidence calorie_confidence = 2;
  string tip = 3;
  optional Meal meal = 4;
  repeated Clarification clarifications = 5; // Questions to improve confidence when confidence is not HIGH/VERY_HIGH
}
