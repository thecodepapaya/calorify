syntax = "proto3";

package calorify;

import "protos/meal/meal.proto";

message MealMetadata {
  optional string image_url = 1;
  optional string meal_description = 2;
  reserved 3;
  reserved "selected_variations";
}

message MealDetectionResult {
  bool meal_identified = 1;
  meal.CalorieConfidence calorie_confidence = 2;
  string tip = 3;
  optional meal.Meal meal = 4;
  optional MealMetadata metadata = 5;
}

message MealDetectionResponse {
  MealDetectionResult result = 1;
  reserved 2;
  reserved "variations";
}
