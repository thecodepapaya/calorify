syntax = "proto3";

package calorify;

import "protos/meal/meal.proto";


enum PipelineStep {
  PIPELINE_STEP_UNSPECIFIED = 0;
  STARTED = 1;
  DECOMPOSITION = 2;
  INGREDIENTS = 3;
  UNCERTAINTY = 4;
  MEAL_TYPE_QUESTION = 5;
  RESULT = 6;
  ERROR = 7;
}

enum PortionKind {
  PORTION_KIND_UNSPECIFIED = 0;
  COUNT = 1;          // discrete units: roti, slice, egg, piece
  BULK = 2;           // spoon/cup/bowl foods: rice, dal, sabzi, sauces
  PINCH = 3;          // trace amounts: salt, spices, garnishes
  COUNT_QUESTION = 4; // synthetic; clarification asks "how many?"
}


message PipelineCalorieBand {
  int32 min = 1;
  int32 max = 2;
}

message PipelineMacros {
  double calories = 1;
  double protein = 2;
  double carbs = 3;
  double fat = 4;
  double fiber = 5;
}

message PipelineMealHealth {
  meal.HealthScore health_score = 1;
  string health_score_reason = 2;
}

message PipelineDecomposedIngredient {
  string row_id = 1;          // stable id per row; survives clarify replays
  string raw_name = 2;
  string canonical_hint = 3;

  // Total grams used downstream for macro math. Server enforces:
  //   if portion_kind == COUNT: grams_estimated = count * per_unit_grams
  double grams_estimated = 4;
  double min_grams = 5;
  double max_grams = 6;

  string notes = 7;

  PortionKind portion_kind = 8;
  optional double count = 9;            // fractional ok; null if not extracted
  optional double per_unit_grams = 10;
  optional double per_unit_min_grams = 11;
  optional double per_unit_max_grams = 12;
  bool size_specified_by_user = 13;
}

message PipelineResolvedIngredient {
  string row_id = 1;
  string raw_name = 2;
  string canonical_name = 3;
  string match_type = 4;
  double grams = 5;
  PipelineMacros macros = 6;
  string source = 7;
  PortionKind portion_kind = 8;
  optional double count = 9;
  optional double per_unit_grams = 10;
}

message PipelineClarificationOption {
  string option_id = 1;       // stable; matcher key
  string label = 2;           // user-facing copy, no grams
  optional string detail = 3; // optional fine print, e.g. "≈ 35g each"
  double grams = 4;           // total grams this option resolves to (count baked in)
  int32 calorie_delta = 5;
}

message PipelineClarification {
  string clarification_id = 1; // stable; matcher key
  string row_id = 2;           // links to PipelineDecomposedIngredient.row_id
  string ingredient_name = 3;  // display only
  PortionKind portion_kind = 4; // drives icon / copy variant
  string question = 5;
  repeated PipelineClarificationOption options = 6;
  string default_option_id = 7;
}

message PipelineStartedData {
  string analysis_id = 1;
}

message PipelineDecompositionData {
  string analysis_id = 1;
  string meal_name = 2;
  double confidence = 3;
  repeated PipelineDecomposedIngredient ingredients = 4;
  meal.MealType inferred_meal_type = 5;
  bool meal_type_confident = 6;
}

message PipelineIngredientsData {
  string analysis_id = 1;
  string meal_name = 2; // propagated from decomposition for cold-replay headers
  repeated PipelineResolvedIngredient ingredients = 3;
}

message PipelineUncertaintyData {
  string analysis_id = 1;
  string meal_name = 2;
  double variance_percent = 3;
  bool needs_clarification = 4;
  PipelineCalorieBand calorie_band = 5;
  repeated PipelineClarification clarifications = 6;
}

message PipelineMealTypeQuestionData {
  string analysis_id = 1;
  string meal_name = 2;
  string question = 3;
  repeated meal.MealType options = 4;
  meal.MealType inferred_meal_type = 5;
}

message PipelineResultData {
  string analysis_id = 1;
  string meal_name = 2;
  string quantity = 3;
  meal.MealType meal_type = 4;
  string meal_type_source = 5;
  string tip = 6;
  optional PipelineMealHealth health = 7;
  PipelineMacros macros = 8;
  meal.CalorieConfidence calorie_confidence = 9;
  PipelineCalorieBand calorie_band = 10;
  repeated PipelineResolvedIngredient ingredients = 11;
  repeated string confidence_reasons = 12;
}

message PipelineErrorData {
  string analysis_id = 1;
  string message = 2;
  bool retryable = 3;
}


message MealAnalysisPipelineSessionContext {
  PipelineResultData result = 1;
  optional bytes image_bytes = 2;
  optional string image_url = 3;
  optional string text_description = 4;
  bool is_revised = 5;
}
