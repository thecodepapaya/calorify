syntax = "proto3";

package app;
import "protos/common/meal.proto";

message LoggedMeal {
  int32                        client_id  = 1;
  common.Meal                  meal       = 2;
  string                       created_at = 3;
  optional common.MealMetadata metadata   = 4;
}

message FavoriteMeal {
  int32      client_id    = 1;
  LoggedMeal logged_meal  = 2;
  string     favorite_at  = 3;
  string     last_used_at = 4;
}