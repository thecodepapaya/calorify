syntax = "proto3";

package wear;

option java_package = "dev.thecodepapaya.calorify.protocol";
option java_multiple_files = true;

import "protos/app/meal.proto";
import "protos/calorify/meal_detection.proto";
import "protos/user/user.proto";

// Version 1 is the path + JSON protocol retained for one compatibility cycle.
// Version 2 is the first generated, binary envelope protocol.
enum WearProtocolVersion {
  WEAR_PROTOCOL_VERSION_UNSPECIFIED = 0;
  WEAR_PROTOCOL_VERSION_LEGACY_V1 = 1;
  WEAR_PROTOCOL_VERSION_V2 = 2;
}

enum WearOperation {
  WEAR_OPERATION_UNSPECIFIED = 0;
  WEAR_OPERATION_MEAL_LOG = 1;
  WEAR_OPERATION_MEAL_DELETE = 2;
  WEAR_OPERATION_TODAY_MEALS = 3;
  WEAR_OPERATION_CALORIE_GOAL = 4;
  WEAR_OPERATION_USER_PROFILE = 5;
  WEAR_OPERATION_FAVORITES = 6;
  WEAR_OPERATION_AUTH_SESSION = 7;
  WEAR_OPERATION_DETECT_TEXT = 8;
  WEAR_OPERATION_DATA_CHANGED = 9;
}

enum WearErrorCode {
  WEAR_ERROR_CODE_UNSPECIFIED = 0;
  WEAR_ERROR_CODE_INVALID_VERSION = 1;
  WEAR_ERROR_CODE_UNKNOWN_OPERATION = 2;
  WEAR_ERROR_CODE_INVALID_PAYLOAD = 3;
  WEAR_ERROR_CODE_UNAUTHENTICATED = 4;
  WEAR_ERROR_CODE_NOT_FOUND = 5;
  WEAR_ERROR_CODE_REJECTED = 6;
  WEAR_ERROR_CODE_TIMEOUT = 7;
  WEAR_ERROR_CODE_DISCONNECTED = 8;
  WEAR_ERROR_CODE_UNAVAILABLE = 9;
  WEAR_ERROR_CODE_NETWORK = 10;
  WEAR_ERROR_CODE_INTERNAL = 11;
  WEAR_ERROR_CODE_MALFORMED_RESPONSE = 12;
  WEAR_ERROR_CODE_PLATFORM = 13;
}

message WearError {
  WearErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

message MealLogRequest {
  app.LoggedMeal meal = 1;
  string operation_id = 2;
  optional int32 favorite_meal_id = 3;
}

message MealDeleteRequest {
  int32 meal_id = 1;
}

message TodayMealsRequest {}

message CalorieGoalRequest {}

message UserProfileRequest {}

message FavoritesRequest {}

message AuthSessionRequest {}

message DetectTextRequest {
  string text_description = 1;
}

message WearRequest {
  oneof payload {
    MealLogRequest meal_log = 10;
    MealDeleteRequest meal_delete = 11;
    TodayMealsRequest today_meals = 12;
    CalorieGoalRequest calorie_goal = 13;
    UserProfileRequest user_profile = 14;
    FavoritesRequest favorites = 15;
    AuthSessionRequest auth_session = 16;
    DetectTextRequest detect_text = 17;
  }
}

message MealLogResponse {}

message MealDeleteResponse {}

message TodayMealsResponse {
  repeated app.LoggedMeal meals = 1;
}

message CalorieGoalResponse {
  optional int32 goal = 1;
}

message UserProfileResponse {
  user.UserProfile profile = 1;
}

message FavoritesResponse {
  repeated app.FavoriteMeal favorites = 1;
}

message WearAuthSession {
  string uid = 1;
  string auth_token = 2;
  bool is_anonymous = 3;
  string synced_at = 4;
  reserved 5;
  reserved "fcm_token";
}

message AuthSessionResponse {
  WearAuthSession session = 1;
}

message DetectTextResponse {
  calorify.MealDetectionResponse response = 1;
}

message WearResponse {
  optional WearError error = 1;

  oneof payload {
    MealLogResponse meal_log = 10;
    MealDeleteResponse meal_delete = 11;
    TodayMealsResponse today_meals = 12;
    CalorieGoalResponse calorie_goal = 13;
    UserProfileResponse user_profile = 14;
    FavoritesResponse favorites = 15;
    AuthSessionResponse auth_session = 16;
    DetectTextResponse detect_text = 17;
  }
}

message DataChangedEvent {
  repeated WearOperation operations = 1;
}

message WearEvent {
  oneof payload {
    DataChangedEvent data_changed = 10;
  }
}

message WearEnvelope {
  uint32 version = 1;
  string request_id = 2;
  WearOperation operation = 3;

  oneof body {
    WearRequest request = 10;
    WearResponse response = 11;
    WearEvent event = 12;
  }
}
