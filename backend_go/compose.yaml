services:

  server:
    build:
      context: .
      target: final
    container_name: ${APP_NAME}
    env_file: .env
    ports: [ "${EXTERNAL_PORT}:8000" ]
    depends_on:
      calorify_db:
        condition: service_healthy
      usda_db:
        condition: service_healthy
    secrets: [ "firebase-adminsdk.json" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8000/ready > /dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  calorify_db:
    image: postgres:15-alpine
    container_name: ${POSTGRES_DB}
    env_file: .env
    ports: [ "5432:5432" ]
    volumes: [ calorify_pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "user", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  usda_db:
    image: pgvector/pgvector:pg15
    container_name: usda_db
    env_file: .env
    environment:
      POSTGRES_USER: ${USDA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USDA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USDA_POSTGRES_DB}
    ports: [ "5433:5432" ]
    volumes: [ usda_pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "user", "-d", "usda_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3.5G
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  calorify_pgdata:
  usda_pgdata:
  ollama_models:

secrets:
  firebase-adminsdk.json:
    file: firebase-adminsdk.json
