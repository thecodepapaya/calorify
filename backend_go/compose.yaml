services:

  server:
    build:
      context: .
      target: final
    container_name: ${APP_NAME}
    env_file: .env
    ports: [ "${EXTERNAL_PORT}:8000" ]
    depends_on:
      calorify_db:
        condition: service_healthy
      usda_db:
        condition: service_healthy
    secrets: [ "firebase-adminsdk.json" ]

  calorify_db:
    image: postgres:15-alpine
    container_name: ${POSTGRES_DB}
    env_file: .env
    ports: [ "5432:5432" ]
    volumes: [ calorify_pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  usda_db:
    image: postgres:15-alpine
    container_name: usda-db
    env_file: .env
    environment:
      POSTGRES_USER: ${USDA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USDA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USDA_POSTGRES_DB}
    ports: [ "5433:5432" ]
    volumes: [ usda_pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "user" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  calorify_pgdata:
  usda_pgdata:

secrets:
  firebase-adminsdk.json:
    file: firebase-adminsdk.json
