syntax = "proto3";

package api;
import "google/protobuf/timestamp.proto";

import "common/meal.proto";
option go_package = "backend/internal/gen_proto/api";

message MetaInfo{
  optional string                    locale       = 1;
  optional string                    timezone     = 2;
  optional string                    country_code = 3;
  optional google.protobuf.Timestamp timestamp    = 4;
}

message MealAnalysisRequest{
  optional string text         = 1;
  optional string image_base64 = 2;
  MetaInfo        meta_info    = 3;
}

message MealAnalysisResponse{
  string analysis_id = 1;
}

message AnalysisStatusRequest{
  string analysis_id = 1;
}

message AnalysisStatusResponse{
  common.Meal meal        = 1;
  string      analysis_id = 2;
}

message GetMealRequest {
  int32 meal_id = 1;
}

message GetMealResponse {
  common.Meal meal = 1;
}

message ListMealRequest {
  int32  page_size  = 1;
  string page_token = 2;
}

message ListMealResponse {
  repeated common.Meal meals           = 1;
  string               next_page_token = 2;
}

message LogMealRequest {
  int32 meal_id = 1;
}

message LogMealResponse {}

message UpdateMealRequest {
  int32 meal_id = 1;
}

message UpdateMealResponse {}
