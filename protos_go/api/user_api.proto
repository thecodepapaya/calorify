syntax = "proto3";

package api;
import "common/user.proto";
import "server/notifications.proto";
option go_package = "backend/internal/gen_proto/api";

message UserDetailsRequest{}

message UpdateUserRequest{
  common.User user = 1;
}

message UserDetailsResponse{
  common.User user = 1;
}

message UpdateFcmTokenRequest{
  server.Fcm fcm = 1;
}

message HealthDataRequest{
  common.HealthData health_data = 1;
}

message HealthDataResponse{
  common.HealthData health_data = 1;
}
