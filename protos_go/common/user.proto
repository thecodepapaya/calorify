syntax = "proto3";

package common;
option go_package = "backend/internal/gen_proto/common";

enum Gender {
  OTHER  = 0;
  MALE   = 1;
  FEMALE = 2;
}

enum WeightGoal {
  LOSE_WEIGHT     = 0;
  MAINTAIN_WEIGHT = 1;
  GAIN_WEIGHT     = 2;
}

enum ActivityLevel {
  SEDENTARY         = 0;
  LIGHTLY_ACTIVE    = 1;
  MODERATELY_ACTIVE = 2;
  VERY_ACTIVE       = 3;
  EXTREMELY_ACTIVE  = 4;
}

enum HeightUnit{
  CM = 0;
  FT = 1;
}

message Height{
  double     value = 1;
  HeightUnit unit  = 2;
}

enum WeightUnit{
  KG = 0;
  LB = 1;
}

message Weight{
  double     value = 1;
  WeightUnit unit  = 2;
}

message User {
  int32           id          = 1;
  string          firebase_id = 2;
  optional string name        = 3;
  optional string email       = 4;
}

message HealthData {
  int32                  user_id            = 1;
  optional Height        height             = 2;
  optional Weight        weight             = 3;
  optional Weight        target_weight      = 4;
  optional Gender        gender             = 5;
  optional string        date_of_birth      = 6; // ISO calendar date (e.g., "1990-01-15")
  optional WeightGoal    weight_goal        = 7;
  optional ActivityLevel activity_level     = 8;
  optional int32         daily_calorie_goal = 9;
}
