syntax = "proto3";

package common;
import "google/protobuf/timestamp.proto";

import "common/meal.proto";
option go_package = "backend/internal/gen_proto/common";

enum Gender {
  OTHER  = 0;
  MALE   = 1;
  FEMALE = 2;
}

enum WeightGoal {
  LOSE_WEIGHT     = 0;
  MAINTAIN_WEIGHT = 1;
  GAIN_WEIGHT     = 2;
}

enum ActivityLevel {
  SEDENTARY         = 0;
  LIGHTLY_ACTIVE    = 1;
  MODERATELY_ACTIVE = 2;
  VERY_ACTIVE       = 3;
  EXTREMELY_ACTIVE  = 4;
}

enum HeightUnit{
  CM = 0;
  FT = 1;
}

message Height{
  double     value = 1;
  HeightUnit unit  = 2;
}

enum WeightUnit{
  KG = 0;
  LB = 1;
}

message Weight{
  double     value = 1;
  WeightUnit unit  = 2;
}

message User {
  optional string                    name           = 1;
  optional string                    email          = 2;
  optional google.protobuf.Timestamp created_at     = 3;
  optional google.protobuf.Timestamp last_active_at = 4;
}

message HealthData {
  optional Height        height           = 1;
  optional Weight        weight           = 2;
  optional Weight        target_weight    = 3;
  optional Gender        gender           = 4;
  optional string        date_of_birth    = 5; // ISO calendar date (e.g., "1990-01-15")
  optional WeightGoal    weight_goal      = 6;
  optional ActivityLevel activity_level   = 7;
  optional Macros        daily_macro_goal = 8;
}
