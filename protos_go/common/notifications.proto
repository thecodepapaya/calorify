syntax = "proto3";

package common;
option go_package = "backend/internal/proto_gen/common";

enum DeviceType {
  DEVICE_UNKNOWN = 0;
  DEVICE_ANDROID = 1;
  DEVICE_IOS     = 2;
  DEVICE_WEB     = 3;
}

message FcmToken {
  string              token       = 1;
  optional DeviceType device_type = 2;
}
