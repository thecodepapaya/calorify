syntax = "proto3";

package common;
option go_package = "backend/internal/gen_proto/common";

enum MealType {
  MEAL_TYPE_UNKNOWN   = 0;
  MEAL_TYPE_BREAKFAST = 1;
  MEAL_TYPE_LUNCH     = 2;
  MEAL_TYPE_DINNER    = 3;
  MEAL_TYPE_SNACK     = 4;
}

enum HealthScore {
  NEUTRAL   = 0;
  HEALTHY   = 1;
  UNHEALTHY = 2;
}

enum CalorieConfidence {
  UNSPECIFIED = 0;
  LOW         = 1;
  MEDIUM      = 2;
  HIGH        = 3;
}

message Measurement{
  int32          value     = 1;
  optional int32 min_value = 2;
  optional int32 max_value = 3;
}

message Macros {
  Measurement calories = 1;
  Measurement carbs    = 2;
  Measurement protein  = 3;
  Measurement fat      = 4;
  Measurement fiber    = 5;
}

message MealHealth {
  optional HealthScore health_score        = 1;
  optional string      health_score_reason = 2;
}

message MealMetadata {
  optional string image_url        = 1;
  optional string meal_description = 2;
  optional string timestamp        = 3;
  optional string tip              = 4;
}

message Meal {
  string                name     = 2;
  string                quantity = 3;
  MealType              type     = 4;
  Macros                macros   = 5;
  optional MealHealth   health   = 6;
  optional MealMetadata metadata = 7;
}
