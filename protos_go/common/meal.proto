syntax = "proto3";

package common;
option go_package = "backend/internal/proto_gen/common";

enum MealType {
  MEAL_TYPE_UNKNOWN   = 0;
  MEAL_TYPE_BREAKFAST = 1;
  MEAL_TYPE_LUNCH     = 2;
  MEAL_TYPE_DINNER    = 3;
  MEAL_TYPE_SNACK     = 4;
}

enum HealthScore {
  NEUTRAL   = 0;
  HEALTHY   = 1;
  UNHEALTHY = 2;
}

enum CalorieConfidence {
  UNSPECIFIED = 0;
  LOW         = 1;
  MEDIUM      = 2;
  HIGH        = 3;
}

message MealMacro {
  int32 calories = 1;
  int32 carbs    = 2;
  int32 protein  = 3;
  int32 fat      = 4;
  int32 fiber    = 5;
}

message MealHealth {
  optional HealthScore health_score        = 1;
  optional string      health_score_reason = 2;
}

message MealMetadata {
  optional string image_url        = 1;
  optional string meal_description = 2;
  optional string timestamp        = 3;
}

message Meal {
  int32                 id       = 1;
  string                name     = 2;
  string                quantity = 3;
  MealType              type     = 4;
  MealMacro             macros   = 5;
  optional MealHealth   health   = 6;
  optional MealMetadata metadata = 7;
}
