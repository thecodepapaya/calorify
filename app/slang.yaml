base_locale: en
fallback_strategy: none
input_directory: lib/i18n
input_file_pattern: .i18n.json
output_directory: lib/i18n
namespaces: false
# Strict mode: fail build if translations are missing
strict: true

# Disable lazy loading so all language names are available for the picker immediately
lazy: false

# Configure string interpolation to generate functions for variables
string_interpolation: braces

gpt:
  model: gpt-5-mini
  description: |
    Calorify is a personal nutrition companion and calorie tracker app.
    It uses AI to recognize food from photos and calculate nutritional facts.
    The tone should be helpful, encouraging, and health-focused.
