name: Deploy backend
description: Deploy the backend container to production on the Calorify VM using Docker Compose.

inputs:
  image-tag:
    description: Immutable GHCR tag in sha-<full-commit-sha> form.
    required: true
  ssh-host:
    description: Deployment VM hostname.
    required: true
  ssh-port:
    description: Deployment VM SSH port.
    required: false
    default: "22"
  ssh-user:
    description: Deployment VM SSH user.
    required: true
  ssh-private-key:
    description: Deployment VM SSH private key.
    required: true
  ssh-known-hosts:
    description: Pinned SSH known-hosts entry for the deployment VM.
    required: true
  deploy-path:
    description: Parent of the backend runtime directory on the VM.
    required: true
  github-token:
    description: Short-lived token used to pull the backend image from GHCR.
    required: true

runs:
  using: composite
  steps:
    - name: Validate deployment request
      id: deployment
      shell: bash
      env:
        IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/calorify-backend
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
          printf 'image_tag must be sha- followed by the 40-character lowercase commit SHA\n' >&2
          exit 1
        fi
        printf 'image=%s:%s\n' "${IMAGE_REPOSITORY,,}" "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Require image to exist
      shell: bash
      env:
        IMAGE: ${{ steps.deployment.outputs.image }}
      run: docker manifest inspect "$IMAGE" >/dev/null

    - name: Deploy on the Calorify VM
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        IMAGE: ${{ steps.deployment.outputs.image }}
        GHCR_TOKEN: ${{ inputs.github-token }}
        GHCR_USERNAME: ${{ github.actor }}
      run: |
        set -euo pipefail
        : "${SSH_HOST:?Missing CALORIFY_SSH_HOST}"
        : "${SSH_USER:?Missing CALORIFY_SSH_USER}"
        : "${SSH_PRIVATE_KEY:?Missing CALORIFY_SSH_PRIVATE_KEY}"
        : "${SSH_KNOWN_HOSTS:?Missing CALORIFY_SSH_KNOWN_HOSTS}"
        : "${DEPLOY_PATH:?Missing CALORIFY_DEPLOY_PATH}"
        SSH_PORT="${SSH_PORT:-22}"

        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/calorify_deploy_key
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/calorify_deploy_key ~/.ssh/known_hosts

        backend_path="$DEPLOY_PATH/backend"
        printf -v backend_path_q '%q' "$backend_path"
        printf -v image_q '%q' "$IMAGE"
        printf -v ghcr_username_q '%q' "$GHCR_USERNAME"

        # 1. Sync backend compose definition to the VM
        tar -C backend -cf - compose.yaml | \
          ssh -i ~/.ssh/calorify_deploy_key -p "$SSH_PORT" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SSH_USER@$SSH_HOST" \
            "install -d -m 0755 $backend_path_q && tar -xf - -C $backend_path_q"

        # 2. Authenticate to GHCR on the host, pull the immutable image, and recreate the server with health check wait
        printf '%s\n' "$GHCR_TOKEN" | \
          ssh -i ~/.ssh/calorify_deploy_key -p "$SSH_PORT" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SSH_USER@$SSH_HOST" \
            "cd $backend_path_q && \
             printf '%s\n' \"$GHCR_TOKEN\" | docker login ghcr.io --username $ghcr_username_q --password-stdin >/dev/null && \
             BACKEND_IMAGE=$image_q docker compose pull server && \
             BACKEND_IMAGE=$image_q docker compose up -d --no-build --wait server && \
             docker image prune --force >/dev/null"
