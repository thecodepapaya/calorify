name: Backend / Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published GHCR tag (sha- followed by the full 40-character commit SHA)"
        required: true
        type: string

run-name: Backend / Deploy production (${{ inputs.image_tag }})

permissions:
  contents: read
  packages: read

jobs:
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    concurrency:
      group: calorify-backend-deploy
      cancel-in-progress: false
    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy production
        uses: ./.github/actions/deploy-backend
        with:
          target: production
          image-tag: ${{ inputs.image_tag }}
          ssh-host: ${{ secrets.CALORIFY_SSH_HOST }}
          ssh-port: ${{ secrets.CALORIFY_SSH_PORT }}
          ssh-user: ${{ secrets.CALORIFY_SSH_USER }}
          ssh-private-key: ${{ secrets.CALORIFY_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.CALORIFY_SSH_KNOWN_HOSTS }}
          deploy-path: ${{ secrets.CALORIFY_DEPLOY_PATH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
