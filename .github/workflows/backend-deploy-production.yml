# Workflow: Backend / Deploy production
# Description: Verifies, publishes, and deploys the backend container to production on the Calorify VM.
# Triggers: Manual dispatch (workflow_dispatch). Can build and publish a fresh image from branch or deploy an existing image tag.

name: Backend / Deploy production
run-name: >-
  Backend / Deploy production (${{ inputs.build_and_publish && 'build new image' || inputs.image_tag }})

on:
  workflow_dispatch:
    inputs:
      build_and_publish:
        description: "Build and publish a new image from the selected branch before deploying"
        type: boolean
        default: true
        required: true
      image_tag:
        description: "Existing GHCR image tag to deploy (sha-<40-char-sha>). Ignored if build_and_publish is true."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: calorify-backend-deploy
  cancel-in-progress: false

jobs:
  verify-backend:
    name: Verify backend
    if: inputs.build_and_publish
    permissions:
      contents: read
    uses: ./.github/workflows/ci-backend.yml

  publish-image:
    name: Publish backend image
    needs: verify-backend
    if: inputs.build_and_publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/calorify-backend
          tags: |
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=Calorify Backend
            org.opencontainers.image.description=Calorify API backend

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=calorify-backend
          cache-to: type=gha,mode=max,scope=calorify-backend
          provenance: mode=max
          sbom: true

      - name: Summarize published image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/calorify-backend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Backend container published\n\n'
            printf -- "- Deploy tag: \`%s:sha-%s\`\n" "${IMAGE_REPOSITORY,,}" "$GITHUB_SHA"
            printf -- "- Digest: \`%s\`\n" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-image-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [publish-image]
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Resolve target image tag
        id: resolve
        env:
          BUILD_AND_PUBLISH: ${{ inputs.build_and_publish }}
          PUBLISHED_TAG: ${{ needs.publish-image.outputs.image_tag }}
          PROVIDED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_AND_PUBLISH" == "true" ]]; then
            tag="$PUBLISHED_TAG"
          else
            tag="$PROVIDED_TAG"
          fi
          if [[ ! "$tag" =~ ^sha-[0-9a-f]{40}$ ]]; then
            printf 'Valid image tag (sha-<40-char-sha>) is required; received "%s".\n' "$tag" >&2
            exit 1
          fi
          printf 'image_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production
    needs: [resolve-image-tag]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy production
        uses: ./.github/actions/deploy-backend
        with:
          image-tag: ${{ needs.resolve-image-tag.outputs.image_tag }}
          ssh-host: ${{ secrets.CALORIFY_SSH_HOST }}
          ssh-port: ${{ secrets.CALORIFY_SSH_PORT }}
          ssh-user: ${{ secrets.CALORIFY_SSH_USER }}
          ssh-private-key: ${{ secrets.CALORIFY_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.CALORIFY_SSH_KNOWN_HOSTS }}
          deploy-path: ${{ secrets.CALORIFY_DEPLOY_PATH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
