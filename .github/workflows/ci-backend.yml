name: CI / Backend

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "protos/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

jobs:
  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calorify_test
          POSTGRES_PASSWORD: calorify_test
          POSTGRES_DB: calorify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorify_test -d calorify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://calorify_test:calorify_test@localhost:5432/calorify_test
      CALORIFY_POSTGRES_CONTRACT_TEST: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build production container
        run: docker build -t calorify-backend-ci .
