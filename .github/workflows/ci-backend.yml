name: CI / Backend

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "protos/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

jobs:
  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calorify_test
          POSTGRES_PASSWORD: calorify_test
          POSTGRES_DB: calorify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorify_test -d calorify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://calorify_test:calorify_test@localhost:5432/calorify_test
      CALORIFY_POSTGRES_CONTRACT_TEST: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...
      - name: Build
        run: go build -v ./...

  build-container:
    name: Build production container (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: verify-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build -t calorify-backend-ci .
