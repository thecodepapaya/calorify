name: Flutter App Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options: [internal, beta, production]
      release_status:
        description: Google Play release status
        required: true
        default: completed
        type: choice
        options: [draft, completed]

concurrency:
  group: calorify-phone-store-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate translation catalogs
        run: python3 scripts/audit_translations.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test --coverage test/unit test/widget --concurrency=1
      - name: Enforce coverage baseline
        run: python3 scripts/check_lcov_coverage.py app/coverage/lcov.info --minimum 25
      # Golden images are generated on macOS and differ at the font rasterizer
      # level on Linux. They remain part of the local pre-release suite; the
      # cross-platform unit and widget suites gate this Linux release job.

  release-android-app:
    needs: verify-app
    runs-on: ubuntu-latest
    environment: production
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      PLAY_TRACK: ${{ inputs.track }}
      PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space for Shorebird Android build
        run: |
          set -euo pipefail
          # GitHub's Ubuntu image includes several multi-GB toolchains this
          # Android-only job never uses. Shorebird keeps both Flutter and
          # release artifacts during bundling, so reclaim the space up front.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.0"
          bundler-cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Android SDK build-cache for caching
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/build-cache
          sudo chmod -R 777 /usr/local/lib/android/sdk/build-cache

      - name: Cache Android SDK build-cache
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/build-cache
          key: ${{ runner.os }}-android-sdk-build-cache
          restore-keys: |
            ${{ runner.os }}-android-sdk-build-cache-

      - name: Decode Android signing files
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Missing ANDROID_KEYSTORE_B64}"
          : "${ANDROID_KEY_PROPERTIES_B64:?Missing ANDROID_KEY_PROPERTIES_B64}"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > app/android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_B64" | base64 --decode > app/android/key.properties

      - name: Validate release credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ORACLE_BUCKET_UPLOAD_URL: ${{ secrets.ORACLE_BUCKET_UPLOAD_URL }}
          MEASURE_API_KEY: ${{ secrets.MEASURE_API_KEY }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"
          : "${ORACLE_BUCKET_UPLOAD_URL:?Missing ORACLE_BUCKET_UPLOAD_URL}"
          : "${MEASURE_API_KEY:?Missing MEASURE_API_KEY}"
          : "${SHOREBIRD_TOKEN:?Missing SHOREBIRD_TOKEN}"

      - name: Install Ruby dependencies
        run: bundle install

      - name: Validate Google Play version code
        run: bundle exec fastlane android validate_version_code
        env:
          PLAY_PUBSPEC_PATH: ${{ github.workspace }}/app/pubspec.yaml
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Build Android AppBundle (Main App) with Shorebird
        uses: shorebirdtech/shorebird-release@v1
        env:
          MEASURE_API_KEY: ${{ secrets.MEASURE_API_KEY }}
        with:
          platform: android
          args: >-
            --flavor=prod
            --dart-define=ORACLE_BUCKET_UPLOAD_URL=${{ secrets.ORACLE_BUCKET_UPLOAD_URL }}
            --dart-define=MEASURE_API_KEY=${{ secrets.MEASURE_API_KEY }}
          working-directory: app
          flutter-version: "3.41.0"

      - name: Upload to Play Store
        run: bundle exec fastlane android release
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
