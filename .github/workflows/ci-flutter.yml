# Workflow: CI / Flutter
# Description: Verifies shared packages, and verifies the phone and watch apps.
# Triggers: Pull requests and pushes to main touching app/**, protos/**, or translation scripts; plus manual dispatch.

name: CI / Flutter

on:
  pull_request:
    paths:
      - "app/**"
      - "protos/**"
      - "scripts/audit_translations.py"
      - ".github/actions/verify-phone/**"
      - ".github/workflows/ci-flutter.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "protos/**"
      - "scripts/audit_translations.py"
      - ".github/actions/verify-phone/**"
      - ".github/workflows/ci-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Verify shared packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Verify shared packages
        shell: bash
        run: |
          set -euo pipefail
          for package in i18n models services specs utils widgets; do
            printf '::group::app/shared_packages/%s\n' "$package"
            (
              cd "app/shared_packages/$package"
              flutter pub get
              flutter analyze --no-pub
              if [ -d test ]; then
                flutter test --no-pub --concurrency=1
              fi
            )
            printf '::endgroup::\n'
          done

  phone:
    name: Verify phone app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify phone app
        uses: ./.github/actions/verify-phone

  watch:
    name: Verify watch app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Validate translation catalogs
        run: python3 scripts/audit_translations.py
      - name: Install watch dependencies
        run: flutter pub get
        working-directory: app/watch
      - name: Analyze watch app
        run: flutter analyze
        working-directory: app/watch
      - name: Test watch app
        run: flutter test --concurrency=1
        working-directory: app/watch
