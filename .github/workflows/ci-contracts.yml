name: CI / Generated contracts

on:
  pull_request:
    paths:
      - "protos/**"
      - "backend/src/protos/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "shared_packages/models/lib/src/protos/**"
      - "shared_packages/models/pubspec.yaml"
      - "shared_packages/models/pubspec.lock"
      - "scripts/common.sh"
      - "scripts/generate_protos.sh"
      - ".github/workflows/ci-contracts.yml"
  push:
    branches: [main]
    paths:
      - "protos/**"
      - "backend/src/protos/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "shared_packages/models/lib/src/protos/**"
      - "shared_packages/models/pubspec.yaml"
      - "shared_packages/models/pubspec.lock"
      - "scripts/common.sh"
      - "scripts/generate_protos.sh"
      - ".github/workflows/ci-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contracts:
    name: Verify generated contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install protoc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTOC_VERSION: "34.1"
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64)
              asset="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
              checksum="af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904"
              ;;
            ARM64)
              asset="protoc-${PROTOC_VERSION}-linux-aarch_64.zip"
              checksum="31c5e9e3c7bf013cf41fb97765ee255c140024a6b175b6cc9b64beddd7c23ba7"
              ;;
            *)
              printf 'Unsupported runner architecture: %s\n' "$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          install_dir="$RUNNER_TEMP/protoc-$PROTOC_VERSION"
          gh release download "v$PROTOC_VERSION" \
            --repo protocolbuffers/protobuf \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          install -d "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin 24.0.0
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Generate contracts
        run: ./scripts/generate_protos.sh
      - name: Require committed generated output
        run: |
          changes=$(git status --short --untracked-files=all -- \
            backend/src/protos shared_packages/models/lib/src/protos)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            printf 'Generated contract files are stale. Run ./scripts/generate_protos.sh and commit the result.\n'
            exit 1
          fi
