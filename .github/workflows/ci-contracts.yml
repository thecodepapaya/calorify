name: CI / Generated contracts

on:
  pull_request:
    paths:
      - "protos/**"
      - "backend/src/protos/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "shared_packages/models/lib/src/protos/**"
      - "shared_packages/models/pubspec.yaml"
      - "shared_packages/models/pubspec.lock"
      - "scripts/common.sh"
      - "scripts/generate_protos.sh"
      - ".github/workflows/ci-contracts.yml"
  push:
    branches: [main]
    paths:
      - "protos/**"
      - "backend/src/protos/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "shared_packages/models/lib/src/protos/**"
      - "shared_packages/models/pubspec.yaml"
      - "shared_packages/models/pubspec.lock"
      - "scripts/common.sh"
      - "scripts/generate_protos.sh"
      - ".github/workflows/ci-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contracts:
    name: Verify generated contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Set up protoc
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc-34.1-linux-x86_64.zip"
          install_dir="$RUNNER_TEMP/protoc-34.1"
          curl --fail --location --silent --show-error \
            https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-x86_64.zip \
            --output "$archive"
          printf '%s  %s\n' \
            af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904 \
            "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$install_dir"
          printf '%s/bin\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin 24.0.0
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Generate contracts
        run: ./scripts/generate_protos.sh
      - name: Require committed generated output
        run: |
          changes=$(git status --short --untracked-files=all -- \
            backend/src/protos shared_packages/models/lib/src/protos)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            printf 'Generated contract files are stale. Run ./scripts/generate_protos.sh and commit the result.\n'
            exit 1
          fi
