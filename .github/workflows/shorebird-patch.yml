name: Shorebird Patch

on:
  workflow_dispatch:

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  patch-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Android SDK build-cache for caching
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/build-cache
          sudo chmod -R 777 /usr/local/lib/android/sdk/build-cache

      - name: Cache Android SDK build-cache
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/build-cache
          key: ${{ runner.os }}-android-sdk-build-cache
          restore-keys: |
            ${{ runner.os }}-android-sdk-build-cache-

      - name: Validate patch credentials
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          ORACLE_BUCKET_UPLOAD_URL: ${{ secrets.ORACLE_BUCKET_UPLOAD_URL }}
          MEASURE_API_KEY: ${{ secrets.MEASURE_API_KEY }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Missing ANDROID_KEYSTORE_B64}"
          : "${ANDROID_KEY_PROPERTIES_B64:?Missing ANDROID_KEY_PROPERTIES_B64}"
          : "${ORACLE_BUCKET_UPLOAD_URL:?Missing ORACLE_BUCKET_UPLOAD_URL}"
          : "${MEASURE_API_KEY:?Missing MEASURE_API_KEY}"

      - name: Decode Android signing files
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > app/android/app/upload-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}" | base64 --decode > app/android/key.properties

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird Patch (Android, prod)
        uses: shorebirdtech/shorebird-patch@v1
        env:
          MEASURE_API_KEY: ${{ secrets.MEASURE_API_KEY }}
        with:
          platform: android
          release-version: latest
          args: >-
            --flavor=prod
            --dart-define=ORACLE_BUCKET_UPLOAD_URL=${{ secrets.ORACLE_BUCKET_UPLOAD_URL }}
            --dart-define=MEASURE_API_KEY=${{ secrets.MEASURE_API_KEY }}
          working-directory: app
