name: Secret guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject tracked credentials
        run: ./scripts/check-secrets.sh
