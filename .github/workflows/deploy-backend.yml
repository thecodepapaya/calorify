name: Deploy backend to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published GHCR tag (sha- followed by the full 40-character commit SHA)"
        required: true
        type: string

run-name: Deploy backend to production (${{ inputs.image_tag }})

concurrency:
  group: calorify-backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6

      - name: Validate published image
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/calorify-backend
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            printf 'image_tag must be sha- followed by the full 40-character lowercase commit SHA\n' >&2
            exit 1
          fi
          image="${IMAGE_REPOSITORY,,}:$IMAGE_TAG"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require image to exist
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker manifest inspect "$IMAGE" >/dev/null

      - name: Deploy on the Calorify VM
        env:
          SSH_HOST: ${{ secrets.CALORIFY_SSH_HOST }}
          SSH_PORT: ${{ secrets.CALORIFY_SSH_PORT }}
          SSH_USER: ${{ secrets.CALORIFY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CALORIFY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CALORIFY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.CALORIFY_DEPLOY_PATH }}
          IMAGE: ${{ steps.image.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing CALORIFY_SSH_HOST}"
          : "${SSH_USER:?Missing CALORIFY_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing CALORIFY_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing CALORIFY_SSH_KNOWN_HOSTS}"
          : "${DEPLOY_PATH:?Missing CALORIFY_DEPLOY_PATH}"
          SSH_PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/calorify_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/calorify_deploy_key ~/.ssh/known_hosts
          printf -v backend_path_q '%q' "$DEPLOY_PATH/backend"
          printf -v image_q '%q' "$IMAGE"
          printf -v ghcr_username_q '%q' "$GHCR_USERNAME"
          tar -C backend -cf - \
            docker-compose.yml \
            scripts/deploy-container.sh | \
            ssh -i ~/.ssh/calorify_deploy_key -p "$SSH_PORT" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "$SSH_USER@$SSH_HOST" \
              "install -d -m 0755 $backend_path_q/scripts && tar -xf - -C $backend_path_q"
          printf '%s\n' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/calorify_deploy_key -p "$SSH_PORT" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "$SSH_USER@$SSH_HOST" \
              "cd $backend_path_q && GHCR_USERNAME=$ghcr_username_q ./scripts/deploy-container.sh production $image_q"
