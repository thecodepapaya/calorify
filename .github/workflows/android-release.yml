# Workflow: Android / Release to Play
# Description: Verifies phone app, sets up Shorebird/credentials, builds release AppBundle with Shorebird, and uploads to Google Play track.
# Triggers: Manual dispatch (workflow_dispatch) with Google Play track and release status options.

name: Android / Release to Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options: [internal, beta, production]
      release_status:
        description: Google Play release status
        required: true
        default: completed
        type: choice
        options: [draft, completed]

run-name: Android / Release to ${{ inputs.track }}

concurrency:
  group: calorify-android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-phone:
    name: Verify phone app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify phone app
        uses: ./.github/actions/verify-phone
      # Golden images are generated on macOS and differ at the font rasterizer
      # level on Linux. They remain part of the local pre-release suite.

  release-phone:
    name: Release phone app
    needs: verify-phone
    runs-on: ubuntu-latest
    environment: production
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      PLAY_TRACK: ${{ inputs.track }}
      PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Shorebird Android build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Prepare Android release
        uses: ./.github/actions/prepare-android-release
        with:
          android-keystore-b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          android-key-properties-b64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          measure-api-key: ${{ secrets.MEASURE_API_KEY }}
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Validate Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"

      - name: Validate Google Play version code
        run: bundle exec fastlane android validate_version_code
        env:
          PLAY_PUBSPEC_PATH: ${{ github.workspace }}/app/calorify/pubspec.yaml
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Build Android AppBundle with Shorebird
        uses: shorebirdtech/shorebird-release@8605c991e8f513451c775ae3909984e9476748a2 # v1
        env:
          MEASURE_API_KEY: ${{ secrets.MEASURE_API_KEY }}
        with:
          platform: android
          args: >-
            --flavor=prod
            --dart-define=MEASURE_API_KEY=${{ secrets.MEASURE_API_KEY }}
          working-directory: app/calorify
          flutter-version: "3.41.0"

      - name: Upload to Play Store
        run: bundle exec fastlane android release
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
