name: Flutter Watch App Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options: [internal, beta, production]
      release_status:
        description: Google Play release status
        required: true
        default: completed
        type: choice
        options: [draft, completed]

concurrency:
  group: calorify-watch-store-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-android-watch-app:
    runs-on: ubuntu-latest
    environment: production
    env:
      PLAY_TRACK: ${{ inputs.track }}
      PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.0"
          bundler-cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Android SDK build-cache for caching
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/build-cache
          sudo chmod -R 777 /usr/local/lib/android/sdk/build-cache

      - name: Cache Android SDK build-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/build-cache
          key: ${{ runner.os }}-android-sdk-build-cache
          restore-keys: |
            ${{ runner.os }}-android-sdk-build-cache-

      - name: Decode Android signing files
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Missing ANDROID_KEYSTORE_B64}"
          : "${ANDROID_KEY_PROPERTIES_B64:?Missing ANDROID_KEY_PROPERTIES_B64}"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > watch_app/android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_B64" | base64 --decode > watch_app/android/key.properties

      - name: Validate release credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: watch_app
        run: flutter pub get

      - name: Analyze
        working-directory: watch_app
        run: flutter analyze

      - name: Test
        working-directory: watch_app
        run: flutter test

      - name: Build Android AppBundle (Watch App)
        working-directory: watch_app
        run: flutter build appbundle --release

      - name: Preserve signed Watch AppBundle
        uses: actions/upload-artifact@v4
        with:
          name: calorify-watch-${{ github.run_id }}
          path: watch_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Install Ruby dependencies
        run: bundle install

      - name: Upload Watch App to Play Store
        run: bundle exec fastlane android release_watch
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
