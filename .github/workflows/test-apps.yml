name: Test Flutter apps

on:
  pull_request:
    paths:
      - "app/**"
      - "watch_app/**"
      - "shared_packages/**"
      - "protos/**"
      - "scripts/audit_translations.py"
      - "scripts/check_lcov_coverage.py"
      - ".github/workflows/test-apps.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "watch_app/**"
      - "shared_packages/**"
      - "protos/**"
      - "scripts/audit_translations.py"
      - "scripts/check_lcov_coverage.py"
      - ".github/workflows/test-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [i18n, models, services, specs, utils, widgets]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: shared_packages/${{ matrix.package }}
      - run: flutter analyze --no-pub
        working-directory: shared_packages/${{ matrix.package }}
      - name: Run package tests when present
        working-directory: shared_packages/${{ matrix.package }}
        run: |
          if [ -d test ]; then
            flutter test --no-pub --concurrency=1
          fi

  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - run: python3 scripts/audit_translations.py --fail-on-source-copies
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test --coverage test/unit test/widget --concurrency=1
        working-directory: app
      - run: python3 scripts/check_lcov_coverage.py app/coverage/lcov.info --minimum 25
      - name: Build phone Android debug app
        run: >-
          flutter build apk --debug --flavor dev --no-pub
          --dart-define=FLUTTER_APP_FLAVOR=dev
        working-directory: app

  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - run: python3 scripts/audit_translations.py --fail-on-source-copies
      - run: flutter pub get
        working-directory: watch_app
      - run: flutter analyze
        working-directory: watch_app
      - run: flutter test --coverage --concurrency=1
        working-directory: watch_app
      - run: python3 scripts/check_lcov_coverage.py watch_app/coverage/lcov.info --minimum 25
      - name: Build watch Android debug app
        run: flutter build apk --debug --no-pub
        working-directory: watch_app
