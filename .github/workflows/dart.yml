name: Flutter Android CI/CD

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.0"
          bundler-cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK build-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/build-cache
          key: ${{ runner.os }}-android-sdk-build-cache
          restore-keys: |
            ${{ runner.os }}-android-sdk-build-cache-

      - name: Decode Android signing files
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > app/android/app/upload-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}" | base64 --decode > app/android/key.properties
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > watch_app/android/app/upload-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}" | base64 --decode > watch_app/android/key.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Build Android AppBundle (Main App) with Shorebird
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          args: --flavor=prod
          working-directory: app
          flutter-version: "3.38.5"

      # - name: Build Android AppBundle (Watch App)
      #   working-directory: watch_app
      #   run: flutter build appbundle --release

      - name: Install Ruby dependencies
        run: bundle install

      - name: Upload to Play Store
        run: bundle exec fastlane android release
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      
