name: Verify backend

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "protos/**"
      - ".github/workflows/backend-checks.yml"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/publish-backend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calorify_test
          POSTGRES_PASSWORD: calorify_test
          POSTGRES_DB: calorify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorify_test -d calorify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://calorify_test:calorify_test@localhost:5432/calorify_test
      CALORIFY_POSTGRES_CONTRACT_TEST: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:coverage
      - run: docker build -t calorify-backend-ci .
