name: Publish backend container

on:
  push:
    branches: [main]
    paths:
      - "backend/.dockerignore"
      - "backend/Dockerfile"
      - "backend/docker-entrypoint.sh"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.json"
      - "backend/src/**"
      - "backend/migrations/**"
      - "backend/data/meal_analysis_tips.json"
      - "protos/**"
      - ".github/workflows/backend-checks.yml"
      - ".github/workflows/publish-backend.yml"

concurrency:
  group: calorify-backend-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/backend-checks.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up multi-platform emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/calorify-backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=Calorify Backend
            org.opencontainers.image.description=Calorify API backend

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=calorify-backend
          cache-to: type=gha,mode=max,scope=calorify-backend
          provenance: mode=max
          sbom: true

      - name: Summarize published image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/calorify-backend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Backend container published\n\n'
            printf -- '- Deploy tag: `%s:sha-%s`\n' "${IMAGE_REPOSITORY,,}" "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
