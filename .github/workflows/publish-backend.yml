name: Publish backend container

on:
  push:
    branches: [main]
    paths:
      - "backend/.dockerignore"
      - "backend/Dockerfile"
      - "backend/docker-compose.yml"
      - "backend/docker-entrypoint.sh"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.json"
      - "backend/src/**"
      - "backend/migrations/**"
      - "backend/data/meal_analysis_tips.json"
      - "backend/scripts/deploy-container.sh"
      - "backend/scripts/deploy-staging.sh"
      - "protos/**"
      - ".github/workflows/backend-checks.yml"
      - ".github/workflows/publish-backend.yml"

concurrency:
  group: calorify-backend-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/backend-checks.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up multi-platform emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/calorify-backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Calorify Backend
            org.opencontainers.image.description=Calorify API backend

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=calorify-backend
          cache-to: type=gha,mode=max,scope=calorify-backend
          provenance: mode=max
          sbom: true

      - name: Summarize published image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/calorify-backend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### Backend container published\n\n'
            printf -- '- Deploy tag: `%s:sha-%s`\n' "${IMAGE_REPOSITORY,,}" "$GITHUB_SHA"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6

      - name: Deploy latest image to staging
        env:
          SSH_HOST: ${{ secrets.CALORIFY_SSH_HOST }}
          SSH_PORT: ${{ secrets.CALORIFY_SSH_PORT }}
          SSH_USER: ${{ secrets.CALORIFY_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CALORIFY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CALORIFY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.CALORIFY_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/calorify-backend:latest
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing CALORIFY_SSH_HOST}"
          : "${SSH_USER:?Missing CALORIFY_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing CALORIFY_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing CALORIFY_SSH_KNOWN_HOSTS}"
          : "${DEPLOY_PATH:?Missing CALORIFY_DEPLOY_PATH}"
          SSH_PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/calorify_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/calorify_deploy_key ~/.ssh/known_hosts
          printf -v backend_path_q '%q' "$DEPLOY_PATH/backend"
          printf -v image_q '%q' "${IMAGE,,}"
          printf -v ghcr_username_q '%q' "$GHCR_USERNAME"
          tar -C backend -cf - \
            docker-compose.yml \
            scripts/deploy-container.sh \
            scripts/deploy-production.sh \
            scripts/deploy-staging.sh | \
            ssh -i ~/.ssh/calorify_deploy_key -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "install -d -m 0755 $backend_path_q/scripts && tar -xf - -C $backend_path_q"
          printf '%s\n' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/calorify_deploy_key -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "cd $backend_path_q && GHCR_USERNAME=$ghcr_username_q ./scripts/deploy-staging.sh $image_q"
