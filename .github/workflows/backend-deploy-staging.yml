name: Deploy Backend (Staging)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/calorify-backend
  CONTEXT: backend
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/calorify' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to staging host (first in list)
        env:
          SSH_HOSTS: ${{ secrets.SSH_HOSTS }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          LOG_HOST: ${{ secrets.LOG_HOST }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOSTS}" ]; then
            echo "SSH_HOSTS is empty"
            exit 1
          fi
          if [ -z "${LOG_HOST}" ]; then
            echo "LOG_HOST is empty"
            exit 1
          fi

          STAGING_HOST=$(printf "%s\n" "${SSH_HOSTS}" | head -n 1)

          echo "Deploying to ${STAGING_HOST}..."
          ssh -p "${SSH_PORT}" "${SSH_USER}@${STAGING_HOST}" \
            "set -euo pipefail; cd ${DEPLOY_PATH}/backend; \
             PROMTAIL_LOKI_URL=http://${LOG_HOST}:3100 BACKEND_IMAGE=${IMAGE} \
             docker compose --profile staging pull backend-staging db-staging promtail; \
             PROMTAIL_LOKI_URL=http://${LOG_HOST}:3100 BACKEND_IMAGE=${IMAGE} \
             docker compose --profile staging up -d --no-build --remove-orphans backend-staging db-staging promtail"
