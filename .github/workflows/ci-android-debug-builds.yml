name: CI / Android debug builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone:
    name: Build phone Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify phone app
        uses: ./.github/actions/verify-phone
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Reclaim unused hosted-runner toolchains
        run: >-
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet
          /opt/ghc /usr/local/share/boost
      - name: Reclaim test build artifacts before APK build
        run: flutter clean
        working-directory: app
      - name: Restore phone dependencies
        run: flutter pub get
        working-directory: app
      - name: Build phone Android debug app
        run: flutter build apk --debug --flavor dev --no-pub
        working-directory: app

  watch:
    name: Build watch Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Validate translation catalogs
        run: python3 scripts/audit_translations.py
      - name: Install watch dependencies
        run: flutter pub get
        working-directory: watch_app
      - name: Analyze watch app
        run: flutter analyze
        working-directory: watch_app
      - name: Test watch app
        run: flutter test --coverage --concurrency=1
        working-directory: watch_app
      - name: Enforce watch coverage baseline
        run: python3 scripts/check_lcov_coverage.py watch_app/coverage/lcov.info --minimum 25
      - name: Build watch Android debug app
        run: flutter build apk --debug --no-pub
        working-directory: watch_app
