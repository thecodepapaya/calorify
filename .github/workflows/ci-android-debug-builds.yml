# Workflow: CI / Android debug builds
# Description: Re-runs phone and watch verification suites, then compiles debug APKs for testing on Android devices and emulators.
# Triggers: Manual dispatch (workflow_dispatch).

name: CI / Android debug builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone:
    name: Build phone Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify phone app
        uses: ./.github/actions/verify-phone
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Reclaim unused hosted-runner toolchains
        run: >-
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet
          /opt/ghc /usr/local/share/boost
      - name: Reclaim test build artifacts before APK build
        run: flutter clean
        working-directory: app/calorify
      - name: Restore phone dependencies
        run: flutter pub get
        working-directory: app/calorify
      - name: Build phone Android debug app
        run: flutter build apk --debug --flavor dev --no-pub
        working-directory: app/calorify

  watch:
    name: Build watch Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Validate translation catalogs
        run: python3 scripts/audit_translations.py
      - name: Install watch dependencies
        run: flutter pub get
        working-directory: app/watch
      - name: Analyze watch app
        run: flutter analyze
        working-directory: app/watch
      - name: Test watch app
        run: flutter test --coverage --concurrency=1
        working-directory: app/watch
      - name: Enforce watch coverage baseline
        run: python3 scripts/check_lcov_coverage.py app/watch/coverage/lcov.info --minimum 25
      - name: Build watch Android debug app
        run: flutter build apk --debug --no-pub
        working-directory: app/watch
